# Copy this file to secrets.yaml and fill in your own values.
# Never commit secrets.yaml - it is listed in .gitignore.

# WiFi
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Password of the fallback hotspot (used when WiFi fails)
fallback_ap_password: "choose-a-password"

# API encryption key: 32 random bytes, base64 encoded.
# Generate one with: openssl rand -base64 32
api_encryption_key: "REPLACE-WITH-32-BYTE-BASE64-KEY="

# Password for over-the-air updates
ota_password: "choose-a-password"

# Bike 1 - see README, "Getting the bike's encryption key"
bike1_mac: "AA:BB:CC:DD:EE:FF"
bike1_encryption_key: "00000000000000000000000000000000"   # 32 hex characters
bike1_key_id: "1"

# Bike 2 (optional)
bike2_mac: "AA:BB:CC:DD:EE:FF"
bike2_encryption_key: "00000000000000000000000000000000"
bike2_key_id: "1"
