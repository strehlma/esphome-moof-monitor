# VanMoof Monitor - dashboard card
#
# Requires: button-card (HACS, custom:button-card).
# Optional: mini-graph-card (HACS) for the 7-day battery graph.
#
# The card finds the bikes on its own: every sub-device of the ESPHome device
# "VanMoof Monitor" that has a Battery sensor is shown. Entity IDs are never
# typed in, so renaming entities does not break it.
#
# Setup:
# 1. Open your dashboard, "Edit dashboard" -> three dots -> "Raw configuration editor".
# 2. Add the two templates below under button_card_templates at the top level
#    (merge them if the key already exists).
# 3. Add a card:
#
#      type: custom:button-card
#      template: vanmoof_bikes_card
#
#    Options (all optional):
#
#      variables:
#        vm_monitor: VanMoof Monitor   # device name of the monitor in Home Assistant
#        vm_low_battery: 30            # battery below this is shown in warning colour
#        vm_show_graph: true           # 7-day battery graph (needs mini-graph-card)
#        vm_show_frame_number: false   # frame number is a serial number, hidden by default

button_card_templates:

  # Finds the bikes. Returns one object per bike with its entity IDs.
  vanmoof_bikes:
    variables:
      vm_monitor: VanMoof Monitor
      # Optional entity whose change forces a re-render (e.g. the monitor's
      # Uptime sensor), so newly added bikes appear without reloading the page.
      vm_watch: ''
      vm_bikes: |-
        [[[
        if(variables.vm_watch)states[variables.vm_watch];
        const devs=Object.values(hass.devices||{});
        const nm=(d)=>d.name_by_user||d.name||'';
        const esc=(s)=>String(s).replace(/[&<>"']/g,(c)=>'&#'+c.charCodeAt(0)+';');
        const mon=devs.find(d=>nm(d)===variables.vm_monitor||d.name===variables.vm_monitor);if(!mon)return [];
        const ents=Object.values(hass.entities||{});
        const base=(id)=>id.replace(/_\d+$/,'');return devs.filter(d=>d.via_device_id===mon.id).map(d=>{const es=ents.filter(e=>e.device_id===d.id);
        const f=(dom,label,suf)=>{const c=es.filter(e=>e.entity_id.startsWith(dom+'.'));
        const e=c.find(e=>e.name===label)||c.filter(e=>base(e.entity_id).endsWith('_'+suf)).sort((a,b)=>a.entity_id.length-b.entity_id.length)[0];return e?e.entity_id:'';};
        const n=nm(d);
        const raw=d.name||n;return {id:raw,n:esc(n),k:esc(n.split(' ')[0]),kr:n.split(' ')[0],bat:f('sensor','Battery','battery'),dist:f('sensor','Distance','distance'),frame:f('sensor','Frame Number','frame_number'),con:f('binary_sensor','In Range','in_range'),lock:f('binary_sensor','Lock State','lock_state'),chg:f('binary_sensor','Charging','charging'),mbat:f('sensor','Module Battery','module_battery'),err:f('sensor','Error Code','error_code'),alarm:f('sensor','Alarm','alarm'),alset:f('sensor','Alarm Setting','alarm_setting'),mst:f('sensor','Module State','module_state'),fw:f('sensor','Firmware','firmware')};}).filter(b=>b.bat).sort((a,b)=>a.id.localeCompare(b.id));
        ]]]

  # The card itself.
  vanmoof_bikes_card:
    template: vanmoof_bikes
    variables:
      vm_title: Bikes
      vm_low_battery: 30
      vm_show_graph: true
      vm_show_frame_number: false
    show_name: false
    show_icon: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - padding: 16px 20px
        - text-align: left
        - cursor: default
      grid:
        - grid-template-areas: '"title" "bikes" "graph"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        title:
          - justify-self: start
        bikes:
          - justify-self: stretch
          - width: 100%
        graph:
          - justify-self: stretch
          - width: 100%
          - --ha-card-background: transparent
          - --ha-card-box-shadow: none
          - --ha-card-border-width: '0'
          - display: >-
              [[[ return variables.vm_show_graph && (variables.vm_bikes || []).length ? 'block' : 'none'; ]]]
    custom_fields:
      title: >-
        [[[ return `<div style="display:flex;align-items:center;gap:8px;"><ha-icon icon="mdi:bicycle-electric" style="display:flex;--mdc-icon-size:18px;color:var(--primary-text-color);opacity:.85;"></ha-icon><span style="font-size:14px;font-weight:500;color:var(--primary-text-color);">${variables.vm_title}</span></div>`; ]]]
      bikes: |-
        [[[
        const B = variables.vm_bikes || [];
        const lang = (hass.locale && hass.locale.language) || hass.language || 'en';
        const num = (e) => { const s = states[e]; const v = s ? parseFloat(s.state) : NaN; return isNaN(v) ? null : v; };
        const st = (e) => (states[e] || {}).state;
        const ok = (e) => { const v = st(e); return v != null && !['unknown', 'unavailable', ''].includes(v); };
        const since = (e) => {
          const s = states[e]; if (!s) return '';
          const d = new Date(s.last_changed);
          return d.toDateString() === new Date().toDateString()
            ? 'since ' + d.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' })
            : 'since ' + d.toLocaleDateString(lang, { day: 'numeric', month: 'short' });
        };
        const txt = (e) => ok(e) ? st(e) : '–';
        const R = (l, v) => `<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:6px;"><span style="color:var(--secondary-text-color);">${l}</span><span style="font-weight:600;color:var(--primary-text-color);text-align:right;">${v}</span></div>`;
        const G = (items) => `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));column-gap:20px;margin-top:4px;">${items.join('')}</div>`;
        const low_at = variables.vm_low_battery;
        const sec = (b, i) => {
          const v = num(b.bat);
          const on = st(b.con) === 'on';
          const low = v != null && v < low_at;
          const km = num(b.dist);
          const kmt = km != null ? Math.round(km).toLocaleString(lang) + ' km' : '–';
          const con = on ? 'in range' : 'out of range · ' + since(b.con);
          const lock = ok(b.lock) ? (st(b.lock) === 'on' ? 'Locked' : 'Unlocked') : '–';
          const err = num(b.err) === 0 ? 'none' : (ok(b.err) ? `<span style="color:var(--warning-color);">${st(b.err)}</span>` : '–');
          const bar = v != null
            ? `<div style="height:6px;border-radius:3px;background:var(--divider-color);margin-top:10px;overflow:hidden;"><div style="height:100%;width:${Math.max(0, Math.min(100, v))}%;border-radius:3px;background:${low ? 'var(--warning-color)' : 'var(--success-color)'};"></div></div>`
            : '';
          const rows = [
            R('Lock', lock),
            R('Alarm', txt(b.alarm)),
            R('Module battery', num(b.mbat) != null ? Math.round(num(b.mbat)) + ' %' : '–'),
            R('Error code', err),
            R('Total distance', kmt),
            R('Firmware', txt(b.fw)),
          ];
          if (variables.vm_show_frame_number) rows.push(R('Frame number', txt(b.frame)));
          return `<div style="padding:14px 0 12px;${i ? 'border-top:1px solid var(--divider-color);' : ''}">`
            + `<div style="display:flex;align-items:center;gap:10px;"><ha-icon icon="mdi:bicycle-electric" style="display:flex;flex:none;--mdc-icon-size:20px;color:var(--primary-text-color);opacity:${on ? 0.85 : 0.45};"></ha-icon>`
            + `<span style="flex:1;font-size:14px;font-weight:500;color:var(--primary-text-color);">${b.n}</span>`
            + `<span style="font-size:12px;color:var(--secondary-text-color);">${con}</span></div>`
            + `<div style="display:flex;align-items:baseline;gap:4px;margin-top:10px;"><span style="font-size:18px;font-weight:600;line-height:1;color:${low ? 'var(--warning-color)' : 'var(--primary-text-color)'};">${v != null ? Math.round(v) : '–'}</span>`
            + `<span style="font-size:13px;color:var(--secondary-text-color);">% battery</span>`
            + (st(b.chg) === 'on' && on ? `<span style="font-size:13px;font-weight:500;color:var(--success-color);margin-left:6px;">· charging</span>` : '')
            + `</div>` + bar + G(rows) + `</div>`;
        };
        return B.length
          ? B.map(sec).join('')
          : `<div style="margin-top:12px;font-size:13px;color:var(--secondary-text-color);">No bikes found. Is there a device named "${variables.vm_monitor}" with bike sub-devices?</div>`;
        ]]]
      graph:
        card:
          type: custom:mini-graph-card
          entities: |-
            [[[
            const C = ['#E6A23C', '#409EFF', '#67C23A', '#F56C6C'];
            return (variables.vm_bikes || []).map((b, i) => ({ entity: b.bat, name: b.id, color: C[i % C.length] }));
            ]]]
          hours_to_show: 168
          points_per_hour: 0.5
          line_width: 2
          height: 110
          lower_bound: 0
          upper_bound: 100
          show:
            name: false
            icon: false
            state: false
            legend: true
            labels: false
            points: false
            fill: false
